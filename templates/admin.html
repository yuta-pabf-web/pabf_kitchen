<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PABF アンケート集計</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell admin-shell">
<div class="admin-top"><div><div class="logo">PABF / SURVEY</div><h1>アンケート集計</h1></div><div class="admin-actions"><a class="secondary" href="/admin/export.csv">CSV</a><form method="post" action="/admin/logout"><button class="secondary" type="submit">ログアウト</button></form></div></div>
<section class="card summary"><div><div class="total-label">総回答数</div><div class="total" id="total">0</div></div><div class="updated" id="updated">更新待ち</div></section>
<div class="grid"><section class="metric-card"><div class="metric-title">1. {{ q1 }}</div><div id="pie1" class="pie" style="--yes:0%"></div><div class="legend"><span><i class="dot"></i>はい</span><span><i class="dot no"></i>いいえ</span></div><div class="stats"><div class="statrow"><span>はい</span><strong id="q1y">0人 / 0%</strong></div><div class="statrow"><span>いいえ</span><strong id="q1n">0人 / 0%</strong></div></div></section>
<section class="metric-card"><div class="metric-title">2. {{ q2 }}</div><div id="pie2" class="pie" style="--yes:0%"></div><div class="legend"><span><i class="dot"></i>はい</span><span><i class="dot no"></i>いいえ</span></div><div class="stats"><div class="statrow"><span>はい</span><strong id="q2y">0人 / 0%</strong></div><div class="statrow"><span>いいえ</span><strong id="q2n">0人 / 0%</strong></div></div></section></div>
<button class="secondary refresh" onclick="loadData()">最新の結果を読み込む</button></main>
<script>async function loadData(){const r=await fetch('/admin/data',{cache:'no-store'});if(!r.ok)return;const d=await r.json();document.getElementById('total').textContent=d.total;[['q1',1],['q2',2]].forEach(([k,n])=>{const x=d[k];document.getElementById('q'+n+'y').textContent=x.yes+'人 / '+x.yes_pct+'%';document.getElementById('q'+n+'n').textContent=x.no+'人 / '+x.no_pct+'%';document.getElementById('pie'+n).style.setProperty('--yes',x.yes_pct+'%');});document.getElementById('updated').textContent='最終更新 '+new Date().toLocaleTimeString('ja-JP');}loadData();setInterval(loadData,10000);</script></body></html>
