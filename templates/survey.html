<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PABF アンケート</title><link rel="stylesheet" href="/static/style.css"></head><body>
<main class="shell"><div class="logo">PABF</div><section class="card"><h1>2問だけのアンケート</h1><p class="sub">ご協力ありがとうございます。20秒ほどで回答できます。</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/submit" id="surveyForm">
<div class="question first"><div class="qnum">QUESTION 01</div><div class="qtext">{{ q1 }}</div><label class="choice"><input type="radio" name="q1" value="はい" required>はい</label><label class="choice"><input type="radio" name="q1" value="いいえ">いいえ</label></div>
<div class="question"><div class="qnum">QUESTION 02</div><div class="qtext">{{ q2 }}</div><label class="choice"><input type="radio" name="q2" value="はい" required>はい</label><label class="choice"><input type="radio" name="q2" value="いいえ">いいえ</label></div>
<button class="primary" id="submitBtn" type="submit">回答を送信</button></form></section></main>
<script>document.getElementById('surveyForm').addEventListener('submit',()=>{const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='送信中…';});</script></body></html>
