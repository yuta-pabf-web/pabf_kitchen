<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PABF アンケート</title>
<style>
:root{--bg:#f5f6f7;--card:#fff;--text:#111318;--muted:#737780;--line:#e4e6ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 64px}
.logo{font-size:14px;font-weight:900;letter-spacing:.14em;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(20,22,26,.05)}
h1{margin:0 0 8px;font-size:28px;line-height:1.35;letter-spacing:-.02em}
.sub{margin:0;color:var(--muted);line-height:1.7}
.q{padding:24px 0;border-top:1px solid var(--line)}
.q.first{border-top:0;padding-top:28px}
.qn{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.08em;margin-bottom:8px}
.qt{font-size:18px;font-weight:800;line-height:1.7;margin-bottom:12px}
.choice{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:15px;padding:14px 15px;margin:9px 0;background:#fff;cursor:pointer}
.choice:has(input:checked){border:2px solid #111;padding:13px 14px;background:#fafafa}
input[type=radio]{width:20px;height:20px;accent-color:#111}
button{width:100%;border:0;border-radius:14px;padding:16px 18px;background:#111;color:#fff;font-size:16px;font-weight:900;cursor:pointer}
button:disabled{opacity:.55}
.msg{margin-top:16px;padding:13px 14px;border-radius:13px;background:#fff2f2;color:#9f1d1d;display:none}
.done{text-align:center;padding:48px 18px}
.done .mark{font-size:42px;margin-bottom:12px}
.small{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6}
@media(max-width:600px){.wrap{padding-top:18px}.card{padding:21px}h1{font-size:24px}.qt{font-size:17px}}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">PABF</div>
  <section class="card">
    <div id="formView">
      <h1>2問だけのアンケート</h1>
      <p class="sub">ご協力ありがとうございます。20秒ほどで回答できます。</p>
      <form id="survey">
        <div class="q first">
          <div class="qn">QUESTION 01</div>
          <div class="qt">あなたにとって、憧れの存在はいますか？</div>
          <label class="choice"><input type="radio" name="q1" value="yes" required>はい</label>
          <label class="choice"><input type="radio" name="q1" value="no">いいえ</label>
        </div>
        <div class="q">
          <div class="qn">QUESTION 02</div>
          <div class="qt">「一度でいいから、この人のように1日を生きてみたい」や「この人が見ている世界を自分もみてみたい」と思ったことはありますか？</div>
          <label class="choice"><input type="radio" name="q2" value="yes" required>はい</label>
          <label class="choice"><input type="radio" name="q2" value="no">いいえ</label>
        </div>
        <button id="submitBtn" type="submit">回答を送信</button>
        <div class="msg" id="msg"></div>
        <div class="small">個人を特定する情報は収集しません。</div>
      </form>
    </div>
    <div id="doneView" class="done" hidden>
      <div class="mark">✓</div>
      <h1>ご回答ありがとうございました。</h1>
    </div>
  </section>
</main>
<script>
const NS="pabfsm20260923x8k2m4p7";
const BASE='https://abacus.jasoncameron.dev';
const form=document.getElementById('survey');
const btn=document.getElementById('submitBtn');
const msg=document.getElementById('msg');

if(localStorage.getItem('pabf_survey_submitted_v2')==='1'){
  document.getElementById('formView').hidden=true;
  document.getElementById('doneView').hidden=false;
}

function hit(key){
  return fetch(BASE+'/hit/'+encodeURIComponent(NS)+'/'+encodeURIComponent(key),{cache:'no-store'})
    .then(r=>{if(!r.ok) throw new Error('HTTP '+r.status); return r.json();});
}

form.addEventListener('submit',async(e)=>{
  e.preventDefault();
  const fd=new FormData(form);
  const q1=fd.get('q1');
  const q2=fd.get('q2');
  if(!q1||!q2)return;

  btn.disabled=true;
  btn.textContent='送信中…';
  msg.style.display='none';

  try{
    await Promise.all([
      hit('total'),
      hit(q1==='yes'?'q1_yes':'q1_no'),
      hit(q2==='yes'?'q2_yes':'q2_no')
    ]);
    localStorage.setItem('pabf_survey_submitted_v2','1');
    document.getElementById('formView').hidden=true;
    document.getElementById('doneView').hidden=false;
  }catch(err){
    msg.textContent='送信に失敗しました。もう一度お試しください。';
    msg.style.display='block';
    btn.disabled=false;
    btn.textContent='回答を送信';
  }
});
</script>
</body>
</html>
